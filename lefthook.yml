pre-commit:
  parallel: true
  commands:
    biome:
      glob: "packages/**/*.{ts,tsx,js,jsx,mjs,json,jsonc,md,toml,yml,yaml}"
      run: bunx @biomejs/biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    # AIDEV-NOTE: markdown mermaid fences are invisible to Biome and to the type
    # checker, yet GitHub renders them — a hyphenated stateDiagram ID (the lifecycle
    # labels are hyphenated) or a `<br/>` in a state diagram silently replaces the
    # diagram with a parse-error box. Rules and rationale: scripts/check-mermaid.mjs.
    mermaid:
      # lefthook's `**/*.md` matches nested paths only, so root files (AGENTS.md,
      # README.md) need the single-star form too — otherwise the top-level docs
      # stay unlinted while every docs/*.md file is checked.
      glob:
        - "*.md"
        - "**/*.md"
      run: node scripts/check-mermaid.mjs {staged_files}
      exclude:
        - "**/node_modules/**"
        - "reference/**"

pre-push:
  commands:
    check:
      # AIDEV-NOTE: strip git's hook env so test fixtures doing real git ops
      # (pi-flow flow-base/deviation-worktree) never act on the REAL repo
      # (PMR-ZMX0 — PMR-ESPA landing incident 2026-11-22). PMR-W9TE is the
      # structural fix (sandboxEnv); this removes the detonator.
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_QUARANTINE_PATH -u GIT_PREFIX -u GIT_LITERAL_PATHSPECS -u GIT_COMMON_DIR -u GIT_OBJECT_DIRECTORY -u GIT_ALTERNATE_OBJECT_DIRECTORIES bun run check
